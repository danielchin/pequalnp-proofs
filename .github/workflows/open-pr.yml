name: Open Upstream Proof PR

on:
  push:
    branches:
      - pr-bot
    paths:
      - 'requests/*.json'

permissions:
  contents: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PRs for new request files
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing repository secret UPSTREAM_PR_TOKEN (classic PAT with public_repo scope)."
            exit 1
          fi

          UPSTREAM="open-goat/pequalnp-proofs"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          DESK="https://pequalnp.com/desk"

          FILES=$(echo "$COMMITS_JSON" | jq -r '[.[] | (.added[]?, .modified[]?)] | unique | .[] | select(startswith("requests/") and endswith(".json"))')

          if [ -z "$FILES" ]; then
            echo "No new request files in this push."
            exit 0
          fi

          for f in $FILES; do
            echo "=== Processing $f ==="
            content=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${AFTER_SHA}" --jq '.content' | tr -d '\n' | base64 -d)
            gap=$(echo "$content" | jq -r '.gap // empty')
            lease=$(echo "$content" | jq -r '.lease // empty')

            if [[ ! "$gap" =~ ^L-[A-Za-z0-9-]+$ ]]; then
              echo "::error::Invalid gap ID in $f: $gap"
              exit 1
            fi
            if [[ -n "$lease" && ! "$lease" =~ ^[A-Za-z0-9-]{1,64}$ ]]; then
              echo "::error::Invalid lease ID in $f"
              exit 1
            fi

            # Single fast duplicate check: open or merged PR from anyone for this gap on upstream
            dup=$(gh pr list -R "${UPSTREAM}" --state all --search "\"${gap}\" in:title" --json number,title,url,state --jq "[.[] | select((.state == \"OPEN\" or .state == \"MERGED\") and (.title == \"${gap}\" or (.title | contains(\"${gap}\"))))][0].url // empty")
            if [ -n "$dup" ]; then
              echo "Skipping ${gap}: existing open/merged PR on ${UPSTREAM}: ${dup}"
              if [ -n "$lease" ]; then
                curl -fsS -m 10 -X POST "${DESK}/release?lease=${lease}&reason=other" >/dev/null || true
              fi
              continue
            fi

            body=""
            if [ -n "$lease" ]; then
              body="Lease: ${lease}"
            fi

            pr_url=$(gh api --method POST "repos/${UPSTREAM}/pulls" \
              -f title="${gap}" \
              -f head="${OWNER}:${gap}" \
              -f base="main" \
              -f body="${body}" \
              --jq '.html_url')
            echo "Opened PR for ${gap}: ${pr_url}"

            if [ -n "$lease" ]; then
              curl -fsS -m 10 -X POST "${DESK}/release?lease=${lease}&reason=submitted" >/dev/null \
                && echo "Released lease for ${gap} as submitted." \
                || echo "::warning::PR opened (${pr_url}), but desk release call failed."
            fi
          done
